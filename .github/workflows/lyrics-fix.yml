name: Build lyrics fix APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test lyrics
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest -PmcLyricTestsOnly=true
      - name: Build APK
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PmcVersionName=0.9.3 \
            -PmcVersionSuffix=-Plus \
            -PmcVersionCode=903006
          cp app/build/outputs/apk/release/app-release.apk HyperMusicCover-0.9.3-Plus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HyperMusicCover-0.9.3-Plus
          path: HyperMusicCover-0.9.3-Plus.apk
          if-no-files-found: error
          retention-days: 14
