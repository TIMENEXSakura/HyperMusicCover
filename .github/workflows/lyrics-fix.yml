name: Build lyrics fix APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lyric-editor-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build the release
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:lintDebug
      - name: Check module entry points and record artifact identity
        run: |
          jq -e '.elements[0] | .versionName == "0.9.58" and .versionCode == 958003' app/build/outputs/apk/release/output-metadata.json
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/HyperMusicCover-0.9.58.apk
          cd dist
          apk=HyperMusicCover-0.9.58.apk
          unzip -p "$apk" META-INF/xposed/java_init.list | grep -Fx 'com.os4.musiccover.Main'
          unzip -p "$apk" META-INF/xposed/scope.list | grep -Fx 'com.android.systemui'
          sha256sum "$apk" > SHA256SUMS.txt
          git rev-parse HEAD > commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HyperMusicCover-0.9.58
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyric-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the isolated hardware rendering fixture
        run: |
          python -m pip install "Pillow>=10,<14" "numpy>=1.26,<3"
          python tools/ci/page_exit_probe.py prepare
          ./gradlew --no-daemon :app:assembleDebug
      - name: Enable the hosted runner's virtualisation device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          heap-size: 384M
          profile: pixel_7
          disable-animations: true
          script: python3 tools/ci/page_exit_probe.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-exit-render-diagnostics
          path: page-exit-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
